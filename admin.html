<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMarket Admin</title>
<style>
  body{font-family:Arial;margin:0;padding:20px;background:#f4f4f4}
  .container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px}
  input,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:5px}
  button{cursor:pointer}
  .approve{background:#28a745;color:#fff;border:none}
  .reject{background:#dc3545;color:#fff;border:none}
  .product{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:5px}
</style>
</head>
<body>
<div class="container">
  <h2>Admin Login</h2>
  <div id="login">
    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Admin Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="panel" style="display:none">
    <h2>Pending Products</h2>
    <button onclick="loadProducts()">Refresh</button>
    <div id="products"></div>
  </div>
</div>

<script>
const API = "YOUR-RENDER-URL"; // <-- CHANGE THIS

async function login(){
  const res = await fetch(API + '/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();
  if(data.success){
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadProducts();
  } else alert('Login failed');
}

async function loadProducts(){
  const res = await fetch(API + '/api/admin/products');
  const products = await res.json();
  document.getElementById('products').innerHTML = products.map(p => `
    <div class="product">
      <h3>${p.product_name} - $${p.price}</h3>
      <p>${p.description}</p>
      <p><b>Seller:</b> ${p.seller_email}</p>
      <p><b>Proof:</b> ${p.payment_proof}</p>
      <button class="approve" onclick="approve(${p.id}, 'approve', '${p.seller_email}', '${p.product_name}')">Approve</button>
      <button class="reject" onclick="approve(${p.id}, 'reject', '${p.seller_email}', '${p.product_name}')">Reject</button>
    </div>
  `).join('');
}

async function approve(id, action, seller_email, product_name){
  await fetch(API + '/api/admin/approve', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id, action, seller_email, product_name})
  });
  alert('Done! Email sent to seller.');
  loadProducts();
}
</script>
</body>
</html>
