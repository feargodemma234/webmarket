<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>WebMarket Admin</title>
<style>body{font-family:Arial;margin:0;background:#f4f4f4}header{background:#dc3545;color:#fff;padding:15px}.container{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}button{padding:10px;cursor:pointer;font-weight:bold}.approve{background:#28a745;color:#fff;border:none}.reject{background:#dc3545;color:#fff;border:none}.product{border:1px solid #ddd;padding:15px;margin:10px 0}</style>
</head>
<body>
<header><h2>WebMarket Admin Panel</h2></header>
<div class="container" id="panel">
  <button onclick="logout()">Logout</button>
  <h3>Pending Products</h3>
  <div id="products">Loading...</div>
</div>

<script>
const API = "https://webmarket-2.onrender.com";
const user = JSON.parse(localStorage.getItem('user') || '{}');

// BLOCK anyone who is not wmarket675@gmail.com
if(!user.email || user.email!== 'wmarket675@gmail.com'){
  alert('Access Denied: Only wmarket675@gmail.com can access admin');
  window.location.href = '/login.html';
}

async function loadProducts(){
  const res = await fetch(API + '/api/admin/products?email=' + user.email);
  const products = await res.json();
  if(products.error) return document.getElementById('products').innerHTML = products.error;
  if(products.length === 0) return document.getElementById('products').innerHTML = '<p>No pending products</p>';
  document.getElementById('products').innerHTML = products.map(p => `
    <div class="product">
      <h3>${p.product_name} - $${p.price} USDT</h3>
      <p>${p.description}</p>
      <p><b>Seller:</b> ${p.seller_email}</p>
      <p><b>TXID:</b> ${p.payment_proof}</p>
      <button class="approve" onclick="approve(${p.id}, 'approve', '${p.seller_email}', '${p.product_name}')">Approve</button>
      <button class="reject" onclick="approve(${p.id}, 'reject', '${p.seller_email}', '${p.product_name}')">Reject</button>
    </div>
  `).join('');
}

async function approve(id, action, seller_email, product_name){
  await fetch(API + '/api/admin/approve', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id, action, seller_email, product_name, admin_email: user.email})
  });
  alert('Done! Email sent to seller.');
  loadProducts();
}

function logout(){ localStorage.removeItem('user'); window.location.href = '/login.html' }
loadProducts();
</script>
</body>
</html>
